<!doctype html>

<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 54px 24px 34px; background: #F9F6F1; color: #241714; font-family: 'Ysabeau Infant', system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 14px">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#241714" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 15px; font-weight: 600; color: #7A6D68">Питання 2 з 7</span>
      <div style="height: 6px; border-radius: 999px; background: #EFE9E2" role="progressbar" aria-label="Анкета" aria-valuenow="2" aria-valuemin="0" aria-valuemax="7"><div style="width: 29%; height: 100%; border-radius: 999px; background: #241714"></div></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.015em">Як часто хочеш <span style="position: relative; display: inline-block"><svg style="position: absolute; left: -6px; bottom: 2px; width: 110%; height: 56%" viewBox="0 0 170 34" preserveAspectRatio="none" aria-hidden="true"><path d="M5 17 C 30 9, 78 12, 118 8 S 164 11, 166 15 C 167 23, 141 28, 101 27 S 22 31, 7 26 C 2 24, 2 20, 5 17 Z" fill="#F2A7BB"></path></svg><span style="position: relative">бачитися?</span></span></h1>
    <p style="margin: 0; font-size: 18px; line-height: 1.45; font-weight: 500; color: #594C47">Підберемо дівчину з тим самим темпом, щоб нікому не було забагато чи замало.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px" role="radiogroup" aria-label="Як часто хочеш бачитися?">
    <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 18px 0 20px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #E6DFD6; color: #241714; font-size: 18px; font-weight: 600">Раз на тиждень<span style="width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid #CFC5BC; box-sizing: border-box; display: block"></span></button>
    <button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 18px 0 20px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #241714; color: #241714; font-size: 18px; font-weight: 800">
      <span style="position: relative"><svg style="position: absolute; left: -6px; bottom: 0; width: 108%; height: 60%" viewBox="0 0 170 34" preserveAspectRatio="none" aria-hidden="true"><path d="M5 17 C 30 9, 78 12, 118 8 S 164 11, 166 15 C 167 23, 141 28, 101 27 S 22 31, 7 26 C 2 24, 2 20, 5 17 Z" fill="#F2A7BB"></path></svg><span style="position: relative">Кілька разів на місяць</span></span>
      <span style="width: 24px; height: 24px; border-radius: 999px; background: #241714; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
    </button>
    <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 18px 0 20px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #E6DFD6; color: #241714; font-size: 18px; font-weight: 600">Раз на місяць<span style="width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid #CFC5BC; box-sizing: border-box; display: block"></span></button>
    <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 18px 0 20px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #E6DFD6; color: #241714; font-size: 18px; font-weight: 600">Як вийде, без графіку<span style="width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid #CFC5BC; box-sizing: border-box; display: block"></span></button>

  <div style="display: flex; align-items: flex-start; gap: 8px; padding-left: 40px; transform: rotate(-2deg)">
    <svg width="40" height="36" viewBox="0 0 56 50" fill="none" stroke="#B23A62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: scaleY(-1)"><path d="M6 6 C 30 4, 46 18, 44 42"></path><path d="M36 36 L 44 44 L 51 35"></path></svg>
    <span style="font-family: 'Bad Script', cursive; font-size: 20px; line-height: 1.3; color: #B23A62; margin-top: 10px">це завжди можна змінити потім</span>
  </div>

  <div style="flex-grow: 1"></div>

  <button type="button" style="height: 58px; border-radius: 999px; background: #241714; color: #F9F6F1; border: 0; font-size: 18px; font-weight: 700">Далі</button>
