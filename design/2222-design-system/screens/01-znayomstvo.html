<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Напрям А — рожевий маркер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ysabeau+Infant:wght@400;500;600;700;800&amp;family=Bad+Script&amp;display=swap">
<style>
body{margin:0}
a{color:#241714}a:hover{color:#594C47}
button{font-family:'Ysabeau Infant',system-ui,sans-serif}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 54px 24px 34px; background: #F9F6F1; color: #241714; font-family: 'Ysabeau Infant', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">22:22</span>
    <span style="font-size: 15px; font-weight: 500; color: #7A6D68">неділя, 1 листопада</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 18px; font-weight: 500; color: #594C47">Сьогодні з тобою знайомиться</span>
    <span style="position: relative; align-self: flex-start; font-size: 46px; line-height: 1.1; font-weight: 800; letter-spacing: -0.015em">
      <svg style="position: absolute; left: -8px; bottom: 4px; width: 112%; height: 58%" viewBox="0 0 170 34" preserveAspectRatio="none" aria-hidden="true"><path d="M5 17 C 30 9, 78 12, 118 8 S 164 11, 166 15 C 167 23, 141 28, 101 27 S 22 31, 7 26 C 2 24, 2 20, 5 17 Z" fill="#F2A7BB"></path></svg>
      <span style="position: relative">Марта</span>
    </span>
  </div>

  <div style="position: relative; height: 300px">
    <div style="position: absolute; left: 6px; top: 8px; width: 222px; box-sizing: border-box; padding: 11px 11px 46px; background: #FFFFFF; box-shadow: 0 10px 26px rgba(36,23,20,0.10), 0 1px 2px rgba(36,23,20,0.06); transform: rotate(-3deg)">
      <div style="height: 214px; background: #EBDDD5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #7A6D68">[Фото Марти]</div>
      <span style="position: absolute; left: 14px; bottom: 9px; font-family: 'Bad Script', cursive; font-size: 19px; color: #241714">Марта, 29 · Поділ</span>
      <span style="position: absolute; left: 70px; top: -13px; width: 84px; height: 26px; background: rgba(242,167,187,0.75); transform: rotate(6deg); display: block"></span>
    </div>
    <div style="position: absolute; right: 0; top: 70px; width: 128px; display: flex; flex-direction: column; gap: 6px; transform: rotate(4deg)">
      <span style="font-family: 'Bad Script', cursive; font-size: 19px; line-height: 1.3; color: #B23A62">у вас обох — книжки і ринок по суботах</span>
      <svg width="64" height="40" viewBox="0 0 64 40" fill="none" stroke="#B23A62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M58 4 C 50 22, 34 32, 10 32"></path><path d="M18 24 L 9 32 L 19 38"></path></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E6DFD6">
    <span style="font-size: 15px; font-weight: 600; color: #7A6D68">Що важливо в подрузі</span>
    <span style="font-size: 19px; line-height: 1.35; font-weight: 600">Чесність. І вміння мовчати поруч, коли слова не потрібні.</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px">
    <button type="button" style="height: 58px; border-radius: 999px; background: transparent; color: #241714; border: 1.5px solid #E6DFD6; font-size: 17px; font-weight: 700">Не зараз</button>
    <a href="#" style="height: 58px; border-radius: 999px; background: #241714; color: #F9F6F1; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 17px; font-weight: 700">Так, познайомитись</a>
  </div>
</div>
</body>
</html>
